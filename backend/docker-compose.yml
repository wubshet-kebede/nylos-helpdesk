services:
  postgres:
    image: postgres:17-alpine
    container_name: nylos-helpdesk-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - nylos_helpdesk_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nylos -d nylos_helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nylos_helpdesk_postgres_data:
